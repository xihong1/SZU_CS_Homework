<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博客页面实验</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: '宋体', serif;
            width: 50%;
            margin: 0 auto;
            background: #fff;
        }
        header.header {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
        }
        header.header nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        header.header nav ul li a {
            color: #fff;
            text-decoration: none;
            padding: 6px 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            padding: 20px 0;
        }
        .text-content {
            flex-basis: 30%;
            background-color: #f2f2f2;
            padding: 20px;
            text-align: justify;
        }
        .blog-content {
            flex-basis: 70%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .blog-content article {
            margin-bottom: 20px;
        }
        footer.footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>

<body>
    <header class="header">
        <nav>
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">博客</a></li>
                <li><a href="#">关于我们</a></li>
                <li><a href="#">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="text-content">
            <p>欢迎来到我们的博客</p>
            <p>
                在这里，您可以阅读关于各种主题的最新文章和资讯。我们提供丰富多彩的内容，涵盖科技、生活、旅行等多个领域。
            </p>
        </div>
        <div class="blog-content">
            <article>
                <h2>文章标题一</h2>
                <p>作者：张三</p>
                <p>这是一篇关于技术趋势的文章，带您深入了解未来几年科技的走向。</p>
            </article>
            <article>
                <h2>文章标题二</h2>
                <p>作者：李四</p>
                <p>
                    本文介绍了如何在现代生活中保持工作与生活的平衡，帮助您减少压力。
                </p>
            </article>
            <article>
                <h2>文章标题三</h2>
                <p>作者：王五</p>
                <p>
                    跟随我们的旅行博客，探索世界上最美丽的景点，感受不同文化的魅力。
                </p>
            </article>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 博客平台. 保留所有权利。</p>
    </footer>
</body>

</html>
