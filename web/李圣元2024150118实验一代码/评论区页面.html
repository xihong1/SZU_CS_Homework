<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论区页面</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: #e5e5e5;
            color: #1f2933;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 18px 40px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 52px;
            font-weight: 700;
            color: #1d2731;
        }

        h2 {
            margin: 18px 0 20px;
            text-align: center;
            font-size: 48px;
            color: #1d2731;
        }

        .card {
            background: #f6f6f6;
            border-radius: 8px;
            border: 1px solid #d6d6d6;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }

        .existing {
            padding: 26px 22px;
            font-size: 18px;
            line-height: 1.9;
            color: #2c3a45;
        }

        .existing p {
            margin: 0 0 8px;
        }

        .split {
            border: none;
            border-top: 2px solid #d3d3d3;
            margin: 26px -18px 24px;
        }

        .form-card {
            padding: 16px;
        }

        fieldset {
            margin: 0;
            border: 1px solid #d4d4d4;
            border-radius: 5px;
            padding: 20px 22px 24px;
        }

        legend {
            padding: 0 8px;
            font-size: 38px;
            font-weight: 700;
            color: #1f2a37;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2d3742;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            font-size: 16px;
            padding: 10px 12px;
            outline: none;
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        .confirm {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 14px;
            font-size: 16px;
            color: #2d3742;
        }

        .confirm input {
            width: 16px;
            height: 16px;
        }

        button {
            border: none;
            background: #2db24a;
            color: #fff;
            border-radius: 8px;
            height: 40px;
            padding: 0 20px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #279c40;
        }

        @media (max-width: 720px) {
            h1 {
                font-size: 34px;
            }

            h2 {
                font-size: 30px;
            }

            legend {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>评论区</h1>
        <h2>已有评论</h2>

        <div class="card existing">
            <p><strong>用户1:</strong> 这是一个非常有趣的帖子！</p>
            <p><strong>用户2:</strong> 我完全同意上面的评论。</p>
            <p><strong>用户3:</strong> 感谢分享这个内容！</p>
        </div>

        <hr class="split">

        <div class="card form-card">
            <form>
                <fieldset>
                    <legend>提交新评论</legend>

                    <div class="form-group">
                        <label for="nickname">昵称:</label>
                        <input id="nickname" type="text">
                    </div>

                    <div class="form-group">
                        <label for="content">评论内容:</label>
                        <textarea id="content"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="type">评论类别:</label>
                        <select id="type">
                            <option>问题</option>
                            <option>建议</option>
                            <option>反馈</option>
                        </select>
                    </div>

                    <label class="confirm">
                        <input type="checkbox">
                        我确认我是18岁以上
                    </label>

                    <button type="submit">提交评论</button>
                </fieldset>
            </form>
        </div>
    </div>
</body>

</html>
