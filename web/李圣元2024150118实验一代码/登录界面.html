<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
            background: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 38px;
        }
        h1 {
            margin: 0 0 26px;
            font-size: 48px;
            color: #222;
            font-weight: 700;
        }
        .card {
            width: 760px;
            background: #f6f6f6;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            padding: 44px 54px 48px;
        }
        .form-group {
            margin-bottom: 26px;
        }
        label {
            display: block;
            font-size: 38px;
            color: #444;
            margin-bottom: 10px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 72px;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            padding: 0 18px;
            font-size: 30px;
            color: #222;
            background: #f2f2f2;
            outline: none;
        }
        input::placeholder {
            color: #999;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0 34px;
            color: #555;
            font-size: 36px;
        }
        .remember input {
            width: 24px;
            height: 24px;
        }
        button {
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 7px;
            background: #28a745;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
        }
        button:hover {
            background: #24963f;
        }
        @media (max-width: 900px) {
            h1 {
                font-size: 42px;
            }
            .card {
                width: calc(100% - 42px);
                padding: 28px 26px 30px;
            }
            label {
                font-size: 28px;
            }
            input[type="text"],
            input[type="password"] {
                height: 56px;
                font-size: 22px;
            }
            .remember {
                font-size: 26px;
            }
            button {
                height: 62px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <h1>登录页面</h1>
    <div class="card">
        <form>
            <div class="form-group">
                <label for="username">用户名:</label>
                <input id="username" type="text" placeholder="请输入用户名">
            </div>

            <div class="form-group">
                <label for="password">密码:</label>
                <input id="password" type="password" placeholder="请输入密码">
            </div>
            <label class="remember">
                <input type="checkbox">
                记住密码
            </label>
            <button type="submit">登录</button>
        </form>
    </div>
</body>

</html>
