<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var numbers = [];
        for (var i = 1; i <= 10; i++) {
            numbers.push(i * i);
        }
        function calculateSum(arr) {
            var sum = 0;
            for (var j = 0; j < arr.length; j++) {
                sum += arr[j];
            }
            return sum;
        }
        var totalSum = calculateSum(numbers);
        console.log(numbers);
        console.log("Total sum:", totalSum);
    </script>
</body>
</html>
