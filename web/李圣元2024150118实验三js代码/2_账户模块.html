<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线学习平台 - 账户模块</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .platform-header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        .platform-header h1 { font-size: 2.2em; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .platform-header p { font-size: 15px; opacity: 0.9; }

        .tab-container {
            display: flex;
            background: rgba(255,255,255,0.15);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            width: 460px;
        }
        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.7);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: white;
            color: #667eea;
            border-radius: 12px 12px 0 0;
        }

        .form-container {
            background: white;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            padding: 35px 40px;
            width: 460px;
            display: none;
        }
        .form-container.active { display: block; }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 1.6em;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
            font-size: 13px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group input.error, .form-group select.error { border-color: #f56565; }
        .form-group input.success, .form-group select.success { border-color: #48bb78; }

        .error-message { color: #f56565; font-size: 12px; margin-top: 4px; display: none; }
        .error-message.show { display: block; }
        .success-message { color: #48bb78; font-size: 12px; margin-top: 4px; display: none; }
        .success-message.show { display: block; }

        .password-strength { height: 5px; background: #eee; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .password-strength-bar { height: 100%; width: 0; transition: all 0.3s; }
        .password-strength-bar.weak { width: 33%; background: #f56565; }
        .password-strength-bar.medium { width: 66%; background: #ed8936; }
        .password-strength-bar.strong { width: 100%; background: #48bb78; }
        .strength-text { font-size: 12px; margin-top: 3px; color: #666; }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }
        .checkbox-group input { width: auto; margin-right: 8px; }
        .checkbox-group label { font-weight: normal; margin: 0; font-size: 13px; color: #666; }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

        .result-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
        .result-message.success { background: #c6f6d5; color: #22543d; border: 2px solid #48bb78; }
        .result-message.error { background: #fed7d7; color: #742a2a; border: 2px solid #f56565; }
        .result-message.show { display: block; }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
        .form-footer a { color: #667eea; text-decoration: none; }

        .login-extra {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .login-extra a { color: #667eea; text-decoration: none; }
        .login-extra label { display: flex; align-items: center; font-weight: normal; color: #666; }
        .login-extra input { width: auto; margin-right: 5px; }

        .welcome-panel {
            display: none;
            text-align: center;
            color: white;
        }
        .welcome-panel h2 { color: white; font-size: 2em; margin-bottom: 15px; }
        .welcome-panel p { font-size: 16px; opacity: 0.9; margin-bottom: 20px; }
        .welcome-panel .logout-btn {
            padding: 10px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
        }
        .welcome-panel .logout-btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div class="platform-header">
        <h1>📚 在线学习平台</h1>
        <p>知识改变命运，学习成就未来</p>
    </div>

    <!-- 注册/登录表单 -->
    <div id="authPanel">
        <div class="tab-container">
            <button class="tab-btn active" id="tabLogin">登录</button>
            <button class="tab-btn" id="tabRegister">注册</button>
        </div>

        <!-- 登录表单 -->
        <div class="form-container active" id="loginForm">
            <h2>用户登录</h2>
            <div class="form-group">
                <label for="login-email">邮箱</label>
                <input type="email" id="login-email" placeholder="请输入注册邮箱">
                <div class="error-message" id="login-email-error"></div>
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" placeholder="请输入密码">
                <div class="error-message" id="login-password-error"></div>
            </div>
            <div class="login-extra">
                <label><input type="checkbox" id="remember-me"> 记住我</label>
                <a href="#">忘记密码？</a>
            </div>
            <button class="btn-submit" id="loginBtn">登 录</button>
            <div class="result-message" id="login-result"></div>
            <div class="form-footer">
                还没有账号？<a href="#" id="switchToRegister">立即注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div class="form-container" id="registerForm">
            <h2>用户注册</h2>
            <div class="form-group">
                <label for="reg-username">用户名 *</label>
                <input type="text" id="reg-username" placeholder="3-20个字符，字母数字下划线">
                <div class="error-message" id="reg-username-error"></div>
                <div class="success-message" id="reg-username-success">用户名格式正确</div>
            </div>
            <div class="form-group">
                <label for="reg-email">邮箱 *</label>
                <input type="email" id="reg-email" placeholder="请输入邮箱">
                <div class="error-message" id="reg-email-error"></div>
                <div class="success-message" id="reg-email-success">邮箱格式正确</div>
            </div>
            <div class="form-group">
                <label for="reg-password">密码 *</label>
                <input type="password" id="reg-password" placeholder="至少6个字符">
                <div class="password-strength"><div class="password-strength-bar" id="strength-bar"></div></div>
                <div class="strength-text" id="strength-text"></div>
                <div class="error-message" id="reg-password-error"></div>
                <div class="success-message" id="reg-password-success">密码强度合格</div>
            </div>
            <div class="form-group">
                <label for="reg-confirm-password">确认密码 *</label>
                <input type="password" id="reg-confirm-password" placeholder="请再次输入密码">
                <div class="error-message" id="reg-confirm-password-error"></div>
                <div class="success-message" id="reg-confirm-password-success">密码一致</div>
            </div>
            <div class="form-group">
                <label for="reg-age">年龄 *</label>
                <input type="number" id="reg-age" placeholder="18-100">
                <div class="error-message" id="reg-age-error"></div>
                <div class="success-message" id="reg-age-success">年龄有效</div>
            </div>
            <div class="form-group">
                <label for="reg-gender">性别 *</label>
                <select id="reg-gender">
                    <option value="">请选择性别</option>
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
                <div class="error-message" id="reg-gender-error"></div>
                <div class="success-message" id="reg-gender-success">已选择</div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="agree-terms">
                <label for="agree-terms">我已阅读并同意 <a href="#" style="color:#667eea">用户协议</a> 和 <a href="#" style="color:#667eea">隐私政策</a></label>
            </div>
            <div class="error-message" id="reg-terms-error"></div>
            <button class="btn-submit" id="registerBtn">注 册</button>
            <div class="result-message" id="register-result"></div>
            <div class="form-footer">
                已有账号？<a href="#" id="switchToLogin">去登录</a>
            </div>
        </div>
    </div>

    <!-- 登录成功欢迎面板 -->
    <div class="welcome-panel" id="welcomePanel">
        <h2 id="welcomeMsg">欢迎回来！</h2>
        <p>您已成功登录在线学习平台</p>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>

    <script>
    // ==================== DOM元素获取 ====================
    var tabLogin = document.getElementById("tabLogin");
    var tabRegister = document.getElementById("tabRegister");
    var loginForm = document.getElementById("loginForm");
    var registerForm = document.getElementById("registerForm");
    var authPanel = document.getElementById("authPanel");
    var welcomePanel = document.getElementById("welcomePanel");

    // 登录元素
    var loginEmail = document.getElementById("login-email");
    var loginPassword = document.getElementById("login-password");
    var loginEmailError = document.getElementById("login-email-error");
    var loginPasswordError = document.getElementById("login-password-error");
    var loginResult = document.getElementById("login-result");
    var loginBtn = document.getElementById("loginBtn");
    var rememberMe = document.getElementById("remember-me");

    // 注册元素
    var regUsername = document.getElementById("reg-username");
    var regEmail = document.getElementById("reg-email");
    var regPassword = document.getElementById("reg-password");
    var regConfirmPassword = document.getElementById("reg-confirm-password");
    var regAge = document.getElementById("reg-age");
    var regGender = document.getElementById("reg-gender");
    var agreeTerms = document.getElementById("agree-terms");
    var registerBtn = document.getElementById("registerBtn");
    var strengthBar = document.getElementById("strength-bar");
    var strengthText = document.getElementById("strength-text");
    var registerResult = document.getElementById("register-result");

    // ==================== Tab切换 ====================
    function switchTab(activeTab) {
        tabLogin.classList.toggle("active", activeTab === "login");
        tabRegister.classList.toggle("active", activeTab === "register");
        loginForm.classList.toggle("active", activeTab === "login");
        registerForm.classList.toggle("active", activeTab === "register");
    }

    tabLogin.addEventListener("click", function() { switchTab("login"); });
    tabRegister.addEventListener("click", function() { switchTab("register"); });
    document.getElementById("switchToRegister").addEventListener("click", function(e) { e.preventDefault(); switchTab("register"); });
    document.getElementById("switchToLogin").addEventListener("click", function(e) { e.preventDefault(); switchTab("login"); });

    // ==================== 辅助函数 ====================
    function showError(input, errorEl, message) {
        if (input) { input.classList.add("error"); input.classList.remove("success"); }
        errorEl.textContent = message;
        errorEl.classList.add("show");
    }
    function hideError(input, errorEl) {
        if (input) { input.classList.remove("error"); }
        errorEl.classList.remove("show");
    }
    function showSuccess(input, successEl) {
        input.classList.add("success"); input.classList.remove("error");
        successEl.classList.add("show");
    }
    function hideSuccess(successEl) { successEl.classList.remove("show"); }
    function showResult(el, message, type) {
        el.textContent = message;
        el.className = "result-message show " + type;
    }

    // ==================== 注册验证 ====================
    function validateRegUsername() {
        var val = regUsername.value.trim();
        if (val === "") { showError(regUsername, document.getElementById("reg-username-error"), "用户名不能为空"); console.log("用户名验证失败: 用户名不能为空"); return false; }
        if (val.length < 3 || val.length > 20) { showError(regUsername, document.getElementById("reg-username-error"), "用户名长度必须在3-20个字符之间"); console.log("用户名验证失败: 长度不符合要求"); return false; }
        if (!/^[a-zA-Z0-9_]+$/.test(val)) { showError(regUsername, document.getElementById("reg-username-error"), "用户名只能包含字母、数字和下划线"); console.log("用户名验证失败: 包含非法字符"); return false; }
        hideError(regUsername, document.getElementById("reg-username-error"));
        showSuccess(regUsername, document.getElementById("reg-username-success"));
        console.log("用户名验证通过");
        return true;
    }
    function validateRegEmail() {
        var val = regEmail.value.trim();
        if (val === "") { showError(regEmail, document.getElementById("reg-email-error"), "邮箱不能为空"); console.log("邮箱验证失败: 邮箱不能为空"); return false; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { showError(regEmail, document.getElementById("reg-email-error"), "邮箱格式不正确"); console.log("邮箱验证失败: 格式不正确"); return false; }
        hideError(regEmail, document.getElementById("reg-email-error"));
        showSuccess(regEmail, document.getElementById("reg-email-success"));
        console.log("邮箱验证通过");
        return true;
    }
    function validateRegPassword() {
        var val = regPassword.value;
        if (val === "") { showError(regPassword, document.getElementById("reg-password-error"), "密码不能为空"); strengthBar.className = "password-strength-bar"; strengthText.textContent = ""; console.log("密码验证失败: 密码不能为空"); return false; }
        if (val.length < 6) { showError(regPassword, document.getElementById("reg-password-error"), "密码长度至少6个字符"); console.log("密码验证失败: 长度不足"); return false; }
        var score = 0;
        if (val.length >= 8) score++;
        if (/[a-z]/.test(val)) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^a-zA-Z0-9]/.test(val)) score++;
        var level, cls;
        if (score <= 2) { level = "弱"; cls = "weak"; }
        else if (score === 3) { level = "中等"; cls = "medium"; }
        else { level = "强"; cls = "strong"; }
        strengthBar.className = "password-strength-bar " + cls;
        strengthText.textContent = "密码强度: " + level;
        hideError(regPassword, document.getElementById("reg-password-error"));
        showSuccess(regPassword, document.getElementById("reg-password-success"));
        console.log("密码验证通过: 强度 - " + level);
        if (regConfirmPassword.value) validateRegConfirmPassword();
        return true;
    }
    function validateRegConfirmPassword() {
        var val = regConfirmPassword.value;
        if (val === "") { showError(regConfirmPassword, document.getElementById("reg-confirm-password-error"), "请再次输入密码"); console.log("确认密码验证失败: 不能为空"); return false; }
        if (val !== regPassword.value) { showError(regConfirmPassword, document.getElementById("reg-confirm-password-error"), "两次输入的密码不一致"); console.log("确认密码验证失败: 密码不一致"); return false; }
        hideError(regConfirmPassword, document.getElementById("reg-confirm-password-error"));
        showSuccess(regConfirmPassword, document.getElementById("reg-confirm-password-success"));
        console.log("确认密码验证通过");
        return true;
    }
    function validateRegAge() {
        var val = regAge.value.trim();
        if (val === "") { showError(regAge, document.getElementById("reg-age-error"), "年龄不能为空"); console.log("年龄验证失败: 年龄不能为空"); return false; }
        var age = parseInt(val, 10);
        if (isNaN(age) || age < 18 || age > 100) { showError(regAge, document.getElementById("reg-age-error"), "年龄必须在18-100之间"); console.log("年龄验证失败: 年龄超出范围"); return false; }
        hideError(regAge, document.getElementById("reg-age-error"));
        showSuccess(regAge, document.getElementById("reg-age-success"));
        console.log("年龄验证通过");
        return true;
    }
    function validateRegGender() {
        if (regGender.value === "") { showError(regGender, document.getElementById("reg-gender-error"), "请选择性别"); console.log("性别验证失败: 未选择"); return false; }
        hideError(regGender, document.getElementById("reg-gender-error"));
        showSuccess(regGender, document.getElementById("reg-gender-success"));
        console.log("性别验证通过");
        return true;
    }

    // 注册输入框事件绑定
    regUsername.addEventListener("blur", validateRegUsername);
    regUsername.addEventListener("input", validateRegUsername);
    regEmail.addEventListener("blur", validateRegEmail);
    regEmail.addEventListener("input", validateRegEmail);
    regPassword.addEventListener("blur", validateRegPassword);
    regPassword.addEventListener("input", validateRegPassword);
    regConfirmPassword.addEventListener("blur", validateRegConfirmPassword);
    regConfirmPassword.addEventListener("input", validateRegConfirmPassword);
    regAge.addEventListener("blur", validateRegAge);
    regAge.addEventListener("input", validateRegAge);
    regGender.addEventListener("change", validateRegGender);
    regGender.addEventListener("blur", validateRegGender);

    // 注册提交
    registerBtn.addEventListener("click", function() {
        console.log("注册表单提交事件触发");
        var u = validateRegUsername();
        var e = validateRegEmail();
        var p = validateRegPassword();
        var cp = validateRegConfirmPassword();
        var a = validateRegAge();
        var g = validateRegGender();
        if (!agreeTerms.checked) {
            showError(null, document.getElementById("reg-terms-error"), "请先同意用户协议");
            console.log("注册验证失败: 未同意协议");
            showResult(registerResult, "请完善表单信息并同意用户协议", "error");
            return;
        }
        hideError(null, document.getElementById("reg-terms-error"));
        if (u && e && p && cp && a && g) {
            // 保存用户信息到localStorage模拟注册
            var users = JSON.parse(localStorage.getItem("learnPlatformUsers") || "[]");
            var exists = users.some(function(item) { return item.email === regEmail.value.trim(); });
            if (exists) {
                showResult(registerResult, "该邮箱已被注册", "error");
                console.log("注册失败: 邮箱已存在");
                return;
            }
            users.push({
                username: regUsername.value.trim(),
                email: regEmail.value.trim(),
                password: regPassword.value,
                age: regAge.value.trim(),
                gender: regGender.value
            });
            localStorage.setItem("learnPlatformUsers", JSON.stringify(users));
            console.log("注册成功，用户信息已保存");
            showResult(registerResult, "注册成功! 请登录", "success");
            setTimeout(function() { switchTab("login"); loginEmail.value = regEmail.value; }, 1500);
        } else {
            showResult(registerResult, "请检查并修正表单中的错误", "error");
            console.log("注册验证失败");
        }
    });

    // ==================== 登录验证 ====================
    function validateLoginEmail() {
        var val = loginEmail.value.trim();
        if (val === "") { showError(loginEmail, loginEmailError, "邮箱不能为空"); return false; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { showError(loginEmail, loginEmailError, "邮箱格式不正确"); return false; }
        hideError(loginEmail, loginEmailError);
        return true;
    }
    function validateLoginPassword() {
        var val = loginPassword.value;
        if (val === "") { showError(loginPassword, loginPasswordError, "密码不能为空"); return false; }
        hideError(loginPassword, loginPasswordError);
        return true;
    }

    loginEmail.addEventListener("blur", validateLoginEmail);
    loginPassword.addEventListener("blur", validateLoginPassword);

    loginBtn.addEventListener("click", function() {
        console.log("登录表单提交事件触发");
        var e = validateLoginEmail();
        var p = validateLoginPassword();
        if (!e || !p) {
            showResult(loginResult, "请输入邮箱和密码", "error");
            return;
        }

        var users = JSON.parse(localStorage.getItem("learnPlatformUsers") || "[]");
        var user = users.find(function(item) {
            return item.email === loginEmail.value.trim() && item.password === loginPassword.value;
        });

        if (user) {
            console.log("登录成功: " + user.username);
            showResult(loginResult, "登录成功，正在跳转...", "success");
            setTimeout(function() {
                authPanel.style.display = "none";
                document.querySelector(".platform-header").style.display = "none";
                welcomePanel.style.display = "block";
                document.getElementById("welcomeMsg").textContent = "欢迎回来，" + user.username + "！";
            }, 800);
        } else {
            console.log("登录失败: 邮箱或密码错误");
            showResult(loginResult, "邮箱或密码错误，请重试", "error");
        }
    });

    // 记住我功能
    (function() {
        var remembered = localStorage.getItem("learnPlatformRemember");
        if (remembered) {
            var data = JSON.parse(remembered);
            loginEmail.value = data.email || "";
            loginPassword.value = data.password || "";
            rememberMe.checked = true;
        }
    })();

    rememberMe.addEventListener("change", function() {
        if (this.checked) {
            localStorage.setItem("learnPlatformRemember", JSON.stringify({
                email: loginEmail.value,
                password: loginPassword.value
            }));
        } else {
            localStorage.removeItem("learnPlatformRemember");
        }
    });

    // 退出登录
    document.getElementById("logoutBtn").addEventListener("click", function() {
        welcomePanel.style.display = "none";
        authPanel.style.display = "block";
        document.querySelector(".platform-header").style.display = "block";
        loginEmail.value = "";
        loginPassword.value = "";
        loginResult.className = "result-message";
        switchTab("login");
        console.log("用户已退出登录");
    });
    </script>
</body>
</html>
