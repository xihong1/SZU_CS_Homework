<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>手机通讯录管理器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input[type="button"] {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="button"]:hover {
            background-color: #45a049;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            padding: 5px 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <h1>手机通讯录管理器</h1>
    <div class="container">
        <div class="input-group">
            <input type="text" id="name" placeholder="请输入姓名" />
            <input type="text" id="phone" placeholder="请输入电话号码" />
        </div>
        <div class="input-group">
            <input type="button" id="addButton" value="添加" />
        </div>
        <div id="content">
            <ul>
                <li>通讯录为空，请添加联系人。</li>
            </ul>
        </div>
    </div>
    <script>
        var nameInput = document.getElementById("name");
        var phoneInput = document.getElementById("phone");
        var contentArea = document.getElementById("content");
        var addButton = document.getElementById("addButton");

        nameInput.addEventListener("input", function () {
            this.value = this.value.replace(/[^a-zA-Z\u4e00-\u9fa5\s]/g, "");
        });

        phoneInput.addEventListener("input", function () {
            this.value = this.value.replace(/[^0-9]/g, "");
        });

        var db;
        var request = window.indexedDB.open("contactsDB", 1);

        request.onerror = function (event) {
            alert("数据库打开出错");
        };

        request.onsuccess = function (event) {
            db = event.target.result;
            loadContacts();
        };

        request.onupgradeneeded = function (event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("contacts")) {
                db.createObjectStore("contacts", { keyPath: "phone" });
            }
        };

        function createContactItem(name, phone) {
            var li = document.createElement("li");
            var text = document.createTextNode(name + " - " + phone);
            li.appendChild(text);

            var deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "删除";
            deleteBtn.addEventListener("click", function () {
                deleteContact(phone);
            });
            li.appendChild(deleteBtn);

            return li;
        }

        function loadContacts() {
            var list = contentArea.querySelector("ul");
            list.innerHTML = "";

            var transaction = db.transaction("contacts", "readonly");
            var objectStore = transaction.objectStore("contacts");
            var request = objectStore.openCursor();
            var hasContacts = false;

            request.onsuccess = function (event) {
                var cursor = event.target.result;
                if (cursor) {
                    hasContacts = true;
                    var contact = cursor.value;
                    var item = createContactItem(contact.name, contact.phone);
                    list.appendChild(item);
                    cursor.continue();
                } else if (!hasContacts) {
                    var li = document.createElement("li");
                    li.textContent = "通讯录为空，请添加联系人。";
                    list.appendChild(li);
                }
            };
        }

        function addContact() {
            var name = nameInput.value.trim();
            var phone = phoneInput.value.trim();

            if (!name) {
                alert("姓名不能为空！");
                return;
            }
            if (!phone) {
                alert("电话号码不能为空！");
                return;
            }
            if (/<script|javascript:|on\w+=/i.test(name) || /<script|javascript:|on\w+=/i.test(phone)) {
                alert("非法字符输入！");
                return;
            }

            var transaction = db.transaction("contacts", "readwrite");
            var objectStore = transaction.objectStore("contacts");
            var getRequest = objectStore.get(phone);

            getRequest.onsuccess = function (event) {
                var existing = event.target.result;
                if (existing) {
                    if (confirm("该号码已存在，是否覆盖？")) {
                        var putRequest = objectStore.put({ name: name, phone: phone });
                        putRequest.onsuccess = function () {
                            alert("联系人已更新！");
                            loadContacts();
                        };
                    }
                } else {
                    var addRequest = objectStore.add({ name: name, phone: phone });
                    addRequest.onsuccess = function () {
                        alert("联系人已添加！");
                        loadContacts();
                    };
                }
            };

            getRequest.onerror = function () {
                alert("操作失败");
            };
        }

        function deleteContact(phone) {
            var transaction = db.transaction("contacts", "readwrite");
            var objectStore = transaction.objectStore("contacts");
            var request = objectStore.delete(phone);

            request.onsuccess = function () {
                loadContacts();
            };

            request.onerror = function () {
                alert("删除联系人失败");
            };
        }

        addButton.addEventListener("click", addContact);
    </script>
</body>
</html>
