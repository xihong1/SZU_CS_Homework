<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>SQL助手</title>
    <link href="css/demo.css" rel="stylesheet">
    <link href="css/scrollBar.css" rel="stylesheet">
    <script src="js/jquery.min.js"></script>
    <script src="js/suggestionParser.js"></script>
    <script src="js/errorcodeParser.js"></script>
    <script src="js/stringReader.js"></script>
    <script src="js/scrollBar.js"></script>
    <script src="js/suggestionManual.js"></script>
    <style type="text/css">
        #keywordInfoBody > tr > td {
            background-color: #eee;
            color: #000;
            cursor: pointer;
        }

        #keywordInfoBody > tr > td:hover {
            background-color: #069;
            color: #fff;
            cursor: pointer;
            font-size: 10px;
        }

        .showList {
            position: absolute;
            top: 58px;
            left: 276px;
            background: url(img/down.png) no-repeat right bottom;
            width: 20px;
            height: 16px;
            cursor: pointer;
        }

        .removeclass {
            position: absolute;
            top: 58px;
            left: 288px;
            background: url(img/remove.png) no-repeat right bottom;
            width: 20px;
            height: 16px;
            cursor: pointer;
            diaplay: none;
        }

        .hideList {
            position: absolute;
            top: 58px;
            left: 276px;
            background: url(img/up.png) no-repeat right bottom;
            width: 20px;
            height: 16px;
            cursor: pointer;
        }

        /*定义滚动条宽高及背景，宽高分别对应横竖滚动条的尺寸*/
        ::-webkit-scrollbar {
            width: 10px; /*对垂直流动条有效*/
            height: 10px; /*对水平流动条有效*/
            background-color: #BDBDBD;
        }

        /*定义滚动条的轨道颜色、内阴影及圆角*/
        ::-webkit-scrollbar-track {
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, .3);
            background-color: #fff;
            border-radius: 3px;
        }

        /*定义滑块颜色、内阴影及圆角*/
        ::-webkit-scrollbar-thumb {
            border-radius: 7px;
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, .3);
            background-color: #BDBDBD;
        }

        /*定义两端按钮的样式*/
        ::-webkit-scrollbar-button {
            background-color: #fff;
        }

        /*定义右下角汇合处的样式*/
        ::-webkit-scrollbar-corner {
            background: #fff;
        }

    </style>
    <link href="css/index.css" rel="stylesheet">
</head>

<body style="width: 566px;">
<div class="safe_area">
    <div class="buttontitlearea">
        <div id="grammar"
             class="button-title-Item button-title-Item-sm center active" style="text-align: center;height: 23px;line-height: 23px;">语法
        </div>
        <div id="operationList" class="button-title-Item button-title-Item-md center" style="text-align: center;height: 23px;line-height: 23px;">操作列表</div>
    </div>
    <div class="contentArea">
        <div id="grammarContent">
            <div class="grammar_content_title">
                <div class="grammar-item-one">
                    <span class="grammar-font">所有语法：</span>
                    <input type="text"
                           id="keyword" name="keyword" class="keywordselect" value=""
                           autocomplete="off" onclick="hideKeyWord(false);"
                           oninput="checkField(this.value)">
                    <span id="listStatus" class="showList" onclick="hideOrShowKeyWord();"></span>
                    <span id="removeinput" class="removeclass" onclick="$('#keyword').val(''); $('#removeinput').hide(); resetKeyword();"></span>
                </div>
                <div id="keywordInfo" class="keyInfoStyle" style="height: 300px;">
                    <table id="keywordListInfo" cellspacing="0px" width="100%"
                           style="font-size: 10px; line-height: 12px;">
                        <tbody id="keywordInfoBody">
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="divSuggestion">
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
    <script src="js/operationList.js"></script>
    <script src="js/suggestionManual.js"></script>
    <script src="Vastbase%20G100/zh/suggestionJson.js"></script>

</body>
