<!DOCTYPE html>

<head>

    <meta charset="utf-8">
    <title>SQL助手</title>
    <link href="css/demo.css" rel="stylesheet">
    <link href="css/enter_list.css" rel="stylesheet">
    <link href="css/scrollBar.css" rel="stylesheet">
    <script src="js/jquery.min.js"></script>
    <script src="js/suggestionParser.js"></script>
    <script src="js/errorcodeParser.js"></script>

    <link href="css/index.css" rel="stylesheet">

    <style>
        .display {
             display: none;
            opacity: 0;
        }

        /*定义滚动条宽高及背景，宽高分别对应横竖滚动条的尺寸*/
        ::-webkit-scrollbar {
            width: 10px; /*对垂直流动条有效*/
            height: 10px; /*对水平流动条有效*/
            background-color: #BDBDBD;
        }

        /*定义滚动条的轨道颜色、内阴影及圆角*/
        ::-webkit-scrollbar-track {
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, .3);
            background-color: #fff;
            border-radius: 3px;
        }

        /*定义滑块颜色、内阴影及圆角*/
        ::-webkit-scrollbar-thumb {
            border-radius: 7px;
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, .3);
            background-color: #BDBDBD;
        }

        /*定义两端按钮的样式*/
        ::-webkit-scrollbar-button {
            background-color: #fff;
        }

        /*定义右下角汇合处的样式*/
        ::-webkit-scrollbar-corner {
            background: #fff;
        }
    </style>
</head>

<body>
<div class="safe_area">
    <div class="buttontitlearea">

             class="button-title-Item button-title-Item-sm center " style="height: 22px;line-height: 22px;text-align: center; ">语法
        </div>
        <div id="operationListNext"
             class="button-title-Item button-title-Item-md center active" style="height: 22px;line-height: 22px;text-align: center; ">操作列表
        </div>
        <!-- <div id="beginnerGuideNext" class="button-title-Item button-title-Item-md center">新手入门</div>
        <div id="caseNext" class="button-title-Item button-title-Item-sm center">案列</div> -->
    </div>
    <div class="contentArea">
        <div id="responseList">
            <div class="section-header">
                <ol class="breadcrumb" style="padding-inline-start:0px;padding-left:0px;">
                    <li class="breadcrumb-item" style='display:inline-block;'><a href="operationList.html">操作列表</a></li>
                    <li class="breadcrumb-item" style='display:inline-block;' id="operNameS" aria-current="page"></li>
                    <li class="breadcrumb-item font_color" style='display:inline-block;' id="operNameSnext"
                        aria-current="page"></li>

            <div class="grammaticalContent" id="operNameB"></div>

                    在中间窗口中，<span style="color: #ed6b44">选中SQL语句</span>，SQL助手会显示对应的<span
                        style="color: #ed6b44">说明信息</span>。
                </p>
            </div>
        </div>
    </div>
</div>
