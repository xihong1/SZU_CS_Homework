# ============================================================
# DAP (CMSIS-DAP) 版 OpenOCD 配置 —— 由 led_test Debug.cfg 修改而来
#
# 相对 STM32CubeIDE 自动生成的版本，只改了两处：
#   1) source [find interface/stlink-dap.cfg]  ->  cmsis-dap.cfg
#   2) transport select "dapdirect_swd"        ->  "swd"
#
# 原文件（led_test Debug.cfg）会被 CubeIDE 重新生成并覆盖，
# 所以配置调试时请选择本文件，不要改原文件。
# ============================================================

# This is an genericBoard board with a single STM32F429IGTx chip
#
# Generated by STM32CubeIDE
# Take care that such file, as generated, may be overridden without any early notice. Please have a look to debug launch configuration setup(s)

source [find interface/cmsis-dap.cfg]


set WORKAREASIZE 0x8000

transport select "swd"

set CHIPNAME STM32F429IGTx
set BOARDNAME genericBoard

# Enable debug when in low power modes
set ENABLE_LOW_POWER 1

# Stop Watchdog counters when halt
set STOP_WATCHDOG 1

# Debug clock frequency（1 MHz，先保守一点，稳定后可调到 4000~8000）
set CLOCK_FREQ 1000

# Reset configuration
# 注意：这里不用 connect_assert_srst（"连接时保持复位"模式）。
# 实测该模式下正点原子 DAP 会把目标复位线一直拉低，
# 导致 OpenOCD 报 "Cortex-M PARTNO 0x0 is unrecognized" 而连接失败。
reset_config srst_only srst_nogate
set CONNECT_UNDER_RESET 0
set CORE_RESET 0

# ACCESS PORT NUMBER
set AP_NUM 0
# GDB PORT
set GDB_PORT 3333




# BCTM CPU variables

source [find target/stm32f4x.cfg]
